<!doctype html>
<!--
  Content-script cost and safety harness. Loads the REAL content scripts (Shared/Extension/content-*.js) on a
  synthetic ~6,400-element page with a stubbed extension API, tags every callback the extension registers and
  times it, and counts the expensive operations it performs (style reads, attribute writes, layout reads,
  whole-document queries).

    python3 -m http.server 8765            # from the repo root
    http://127.0.0.1:8765/scripts/perf/content_script_harness.html?scenario=idle&t=6
      scenario = idle | class | style | added | invariants      t = seconds measured (default 6)
      src      = folder with the content scripts (default /Shared/Extension): to compare two versions,
                 serve a second copy (git worktree) and pass src=/other/path
      raf=emulate   for headless/background panes that never fire requestAnimationFrame
      trace=1       also report which code paths issue the style reads

  The counts are the reliable numbers (the milliseconds vary run to run). `invariants` checks the safety
  rule: a picture is never visible before it has been checked, also during a storm of other mutations.
  See CLAUDE.md, "Keeping the extension light".
-->
<html><head><meta charset="utf-8"><title>IFS harness</title>
<style>
  body{font:14px sans-serif;margin:8px}
  .item{display:inline-block;width:20px;height:14px;margin:1px;background:#eee}
  .hero{background-image:linear-gradient(red,blue)}
  .card::before{content:"";display:block;height:2px;background-image:linear-gradient(#eee,#ddd)}
  #churn.on .cell{color:#c00}
  #churn .cell{display:inline-block;width:10px;height:10px;background:#cde}
  .anim{display:inline-block;width:10px;height:10px;background:#9c9}
  .bgA{background-image:url(http://127.0.0.1:8765/a.png)}
  #churn.on .cell:first-child{background-image:url(http://127.0.0.1:8765/c.png)}
  .box{display:inline-block;width:40px;height:40px}
</style></head><body>
<script>
// ---------- instrumentation: runs BEFORE the extension scripts ----------
window.H = (() => {
  const stats = { extMs: 0, callbacks: 0, getComputedStyle: 0, pseudoStyle: 0, rects: 0, qsa: 0, qsaEls: 0, setAttr: 0, rmAttr: 0 };
  const st = { loading: false, owner: 'page' };
  const now = () => performance.now();
  const tagNow = () => (st.loading || st.owner === 'ext') ? 'ext' : 'page';
  const counting = () => st.owner === 'ext';
  const wrapCb = fn => {
    if (typeof fn !== 'function') return fn;
    const tag = tagNow();
    return function (...a) {
      const prev = st.owner; st.owner = tag; const t0 = now();
      try { return fn.apply(this, a); } finally {
        const dt = now() - t0;
        if (tag === 'ext' && prev !== 'ext') { stats.extMs += dt; stats.callbacks++; }
        st.owner = prev;
      }
    };
  };
  const _st = window.setTimeout, _si = window.setInterval, _raf = window.requestAnimationFrame;
  window.setTimeout = (fn, ...r) => _st(wrapCb(fn), ...r);
  window.setInterval = (fn, ...r) => _si(wrapCb(fn), ...r);
  window.requestAnimationFrame = location.search.includes('raf=emulate') ? (fn => _st(wrapCb(() => fn(performance.now())), 16)) : (fn => _raf(wrapCb(fn)));
  const wrapCtor = name => { const O = window[name]; if (!O) return; window[name] = class extends O { constructor(cb, ...r) { super(wrapCb(cb), ...r); } }; };
  ['MutationObserver', 'IntersectionObserver', 'ResizeObserver'].forEach(wrapCtor);
  const listeners = new WeakMap();
  const _ael = EventTarget.prototype.addEventListener, _rel = EventTarget.prototype.removeEventListener;
  EventTarget.prototype.addEventListener = function (t, fn, o) {
    if (typeof fn === 'function') { const w = wrapCb(fn); (listeners.get(fn) || listeners.set(fn, new Map()).get(fn)).set(t, w); return _ael.call(this, t, w, o); }
    return _ael.call(this, t, fn, o);
  };
  EventTarget.prototype.removeEventListener = function (t, fn, o) {
    const w = typeof fn === 'function' && listeners.get(fn)?.get(t); return _rel.call(this, t, w || fn, o);
  };
  const _gcs = window.getComputedStyle;
  const traces = {}; window.__traces = traces;
  window.getComputedStyle = function (el, ps) {
    if (counting()) {
      stats.getComputedStyle++; if (ps) stats.pseudoStyle++;
      if (location.search.includes('trace=1')) {
        const frames = (new Error().stack || '').split('\n').filter(l => /content-[a-z]+\.js/.test(l)).map(l => l.trim().replace(/^at /, '').replace(/^.*\//, '')).slice(0, 6).join(' < ');
        traces[frames] = (traces[frames] || 0) + 1;
      }
    }
    return _gcs.call(window, el, ps);
  };
  const _rect = Element.prototype.getBoundingClientRect;
  Element.prototype.getBoundingClientRect = function () { if (counting()) stats.rects++; return _rect.call(this); };
  for (const proto of [Element.prototype, Document.prototype]) {
    const q = proto.querySelectorAll;
    proto.querySelectorAll = function (s) { const r = q.call(this, s); if (counting()) { stats.qsa++; stats.qsaEls += r.length; } return r; };
  }
  const _sa = Element.prototype.setAttribute, _ra = Element.prototype.removeAttribute;
  Element.prototype.setAttribute = function (...a) { if (counting()) stats.setAttr++; return _sa.apply(this, a); };
  Element.prototype.removeAttribute = function (...a) { if (counting()) stats.rmAttr++; return _ra.apply(this, a); };
  let longTasks = 0, longMs = 0;
  try { new PerformanceObserver(l => { for (const e of l.getEntries()) { longTasks++; longMs += e.duration; } }).observe({ entryTypes: ['longtask'] }); } catch (e) {}
  return { stats, st, get longTasks() { return longTasks; }, get longMs() { return longMs; }, now };
})();
// ---------- stub of the extension API ----------
window.browser = {
  runtime: { sendMessage: () => Promise.resolve({ success: true, engine: 'server', isEnabled: true, platform: 'mac', filtered: false, containsSkin: false }), onMessage: { addListener() {} } },
  storage: { local: { get: () => Promise.resolve({ platform: 'mac' }) } }
};
</script>
<script>
  const Q = new URLSearchParams(location.search), SRC = Q.get('src') || '/Shared/Extension', EXT = Q.get('ext') || 'current';
  H.st.loading = true;
  for (const f of ['content-core.js','content.js','content-elements.js','content-backgrounds.js','content-video.js'])
    document.write('<script src="' + SRC + '/' + f + '"><\/script>');
  document.write('<script>H.st.loading = false<\/script>');
</script>
<script>
  // ---------- the page + scenarios (page-owned code) ----------
  const P = new URLSearchParams(location.search);
  const scenario = P.get('scenario') || 'idle', T = (+P.get('t') || 6) * 1000;
  const root = document.createElement('div'); root.id = 'root';
  for (let s = 0; s < 100; s++) {
    const sec = document.createElement('section'); sec.className = 'sec' + (s % 5 === 0 ? ' card' : '');
    for (let i = 0; i < 50; i++) { const el = document.createElement('span'); el.className = 'item' + (i % 7 === 0 ? ' hero' : ''); sec.appendChild(el); }
    root.appendChild(sec);
  }
  const form = document.createElement('form');
  for (let k = 0; k < 3; k++) { const sel = document.createElement('select'); for (let o = 0; o < 300; o++) { const op = document.createElement('option'); op.textContent = 'Country number ' + o; sel.appendChild(op); } form.appendChild(sel); }
  root.appendChild(form);
  const churn = document.createElement('div'); churn.id = 'churn'; for (let i = 0; i < 300; i++) { const c = document.createElement('span'); c.className = 'cell'; churn.appendChild(c); } root.appendChild(churn);
  const anims = document.createElement('div'); for (let i = 0; i < 60; i++) { const a = document.createElement('span'); a.className = 'anim'; anims.appendChild(a); } root.appendChild(anims);
  const feed = document.createElement('div'); feed.id = 'feed'; root.appendChild(feed);
  document.body.appendChild(root);
  console.log('DOM size', document.querySelectorAll('*').length);

  // wait until the extension has finished its startup work (no more style/layout reads for 1 s)
  const waitQuiet = () => new Promise(res => {
    let last = -1, stable = 0, startedAt = performance.now();
    const iv = setInterval(() => {
      const g = H.stats.getComputedStyle + H.stats.rects;
      if (g === last) { if (++stable >= 5) { clearInterval(iv); res(performance.now() - startedAt); } } else { stable = 0; last = g; }
      if (performance.now() - startedAt > 25000) { clearInterval(iv); res(-1); }
    }, 200);
  });
  // ---------- safety invariants: a picture is never shown before it has been checked ----------
  async function runInvariants() {
    const ifs = globalThis.__ifs, out = {};
    ifs.checkUrl = u => new Promise(res => setTimeout(() => res({ dataUrl: u + '#approved', failed: false }), 400));   // slow "check"
    const bg = el => getComputedStyle(el).backgroundImage;
    const tick = () => new Promise(r => setTimeout(r, 0));
    const wait = ms => new Promise(r => setTimeout(r, ms));
    const micro = async () => { await Promise.resolve(); await Promise.resolve(); await Promise.resolve(); };
    // T1: a picture supplied by a stylesheet rule is suppressed until approved, then shown
    const a = document.createElement('div'); a.className = 'box'; document.body.appendChild(a); await wait(500);
    a.classList.add('bgA'); await micro(); out.T1_hiddenImmediately = bg(a) === 'none';
    await tick(); out.T1_hiddenDuringCheck = bg(a) === 'none';
    await wait(1500); out.T1_shownAfterApproval = bg(a).includes('a.png#approved');
    // T2: an inline !important picture is covered before the next paint, even in a storm of other mutations
    const b = document.createElement('div'); b.className = 'box'; document.body.appendChild(b); await wait(500);
    for (let i = 0; i < 40; i++) { churn.classList.toggle('on'); await micro(); }   // dense storm (no timer gaps): many mutation deliveries within a few ms, so the throttle is armed
    b.style.setProperty('background-image', 'url(http://127.0.0.1:8765/b.png)', 'important');
    await micro(); out.T2_inlineImportantCoveredAtOnce = bg(b) === 'none';
    out.T2_notRevealedInStorm = bg(b) === 'none';
    await wait(1800); out.T2_approvedLater = bg(b).includes('b.png#approved') || bg(b) === 'none';
    // T3: a class change on a big container applies a picture to a descendant: hidden, then approved
    churn.classList.remove('on'); await wait(1500);
    const first = churn.firstElementChild; const before = bg(first);
    churn.classList.add('on'); await micro(); out.T3_hiddenImmediately = bg(first) === 'none';
    await wait(3000); out.T3_approvedEventually = bg(first).includes('c.png#approved');
    // T4: an element added with an inline !important picture is covered at once
    const c = document.createElement('div'); c.className = 'box'; c.style.setProperty('background-image', 'url(http://127.0.0.1:8765/d.png)', 'important'); document.body.appendChild(c);
    await micro(); out.T4_addedInlineImportantCovered = bg(c) === 'none';
    out.allPass = Object.values(out).every(v => v === true);
    return { ext: EXT, scenario: 'invariants', out };
  }
  window.__done = new Promise(resolve => {
    waitQuiet().then(settleMs => {
      if (scenario === 'invariants') { runInvariants().then(resolve); return; }
      const s0 = JSON.parse(JSON.stringify(H.stats)), lt0 = H.longTasks, lm0 = H.longMs, t0 = H.now();
      let running = true; const lags = []; let last = H.now();
      const mon = setInterval(() => { const t = H.now(); lags.push(Math.max(0, t - last - 10)); last = t; }, 10);
      let timer = null, raf = null;
      if (scenario === 'class') timer = setInterval(() => churn.classList.toggle('on'), 33);
      if (scenario === 'style') { let n = 0; timer = setInterval(() => { n++; for (const el of anims.children) el.style.transform = 'translateX(' + (n % 50) + 'px)'; }, 16); }
      if (scenario === 'added') timer = setInterval(() => { const d = document.createElement('div'); for (let i = 0; i < 25; i++) { const c = document.createElement('span'); c.className = 'cell'; d.appendChild(c); } feed.appendChild(d); }, 100);
      setTimeout(() => {
        running = false; clearInterval(mon); if (timer) clearInterval(timer);
        lags.sort((a, b) => a - b); const pct = q => +(lags[Math.min(lags.length - 1, Math.floor(q * lags.length))] || 0).toFixed(1);
        const dt = (H.now() - t0) / 1000, d = {};
        for (const k in H.stats) d[k] = +(((H.stats[k] - s0[k])) / (k === 'extMs' ? dt : dt)).toFixed(1);
        resolve({ settleMs: Math.round(settleMs), traces: Object.entries(window.__traces).sort((a, b) => b[1] - a[1]).slice(0, 4), ext: EXT, scenario, seconds: +dt.toFixed(1), domSize: document.querySelectorAll('*').length, hidden: document.hidden, lagMs: { avg: +(lags.reduce((a, b) => a + b, 0) / (lags.length || 1)).toFixed(2), p95: pct(0.95), p99: pct(0.99), max: pct(1) },
          extMsPerSec: d.extMs, extCpuPct: +(d.extMs / 10).toFixed(1), perSec: d, longTasksPerSec: +((H.longTasks - lt0) / dt).toFixed(2), longTaskMsPerSec: +((H.longMs - lm0) / dt).toFixed(0) });
      }, T);
    });
  });
</script></body></html>
